# CI do app web (T064).
#
# NÃO toca em daily-explosm-comic.yml, que é uma automação independente e
# precisa continuar funcionando.
#
# Os caminhos do projeto Flutter legado ENTRAM nos gatilhos, não para serem
# construídos, mas para que o passo "O legado Flutter permanece intocado" rode
# justamente quando alguém mexe neles. Fora do gatilho, a garantia não existia
# no único caso em que importa.

name: web-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.dependency-cruiser.cjs'
      - 'vitest.workspace.ts'
      - '.github/workflows/web-ci.yml'
      # Espelha a lista ALVOS do passo que vigia o legado. Se uma mudar, a
      # outra tem que mudar junto, senão volta a existir caminho legado que
      # ninguém confere.
      - 'lib/**'
      - 'test/**'
      - 'supabase/**'
      - 'docs/**'
      - 'web/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.metadata'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Credenciais de fachada: o build precisa das variáveis existirem, mas o
  # CI não acessa nenhum Supabase real. Segredo nenhum entra aqui.
  NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-ci

jobs:
  verificar:
    name: Testes, tipos e arquitetura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # Node 22 é piso, não preferência: `@supabase/supabase-js` declara
      # `engines: node >=22.0.0`, e no Node 20 faltam os globais `navigator`
      # (chegou no 21) e `WebSocket` (ligado por padrão no 22.4) — a suíte de
      # infrastructure quebrava só aqui, porque quem desenvolve já está no 22+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      # A regra de dependência é verificada à parte, além de rodar dentro
      # da suíte, para que a falha apareça com nome próprio no log.
      - name: Regra de dependência da Arquitetura Limpa
        run: pnpm arch

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

      # ⚠️ A garantia mais importante desta feature. Nenhuma alteração pode
      # tocar o projeto Flutter: a remoção dele tem critérios próprios em
      # _reversa_sdd/sdd/descomissionamento-do-legado.md, e nenhum deles é
      # "o CI passou".
      - name: O legado Flutter permanece intocado
        run: |
          ALVOS="lib test supabase docs web windows pubspec.yaml pubspec.lock analysis_options.yaml .metadata"
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # No primeiro push de uma branch e em force-push, `before` vem com
          # SHA de zeros — não vazio, então `${BASE:-...}` não o substituiria.
          if [ -z "$BASE" ] || ! git rev-parse --verify -q "$BASE^{commit}" >/dev/null; then
            BASE="HEAD^"
          fi
          SUJO=""
          for alvo in $ALVOS; do
            if ! git diff --quiet "$BASE" -- "$alvo"; then
              SUJO="$SUJO $alvo"
            fi
          done
          if [ -n "$SUJO" ]; then
            echo "::error::O código Flutter legado foi modificado:$SUJO"
            echo "A remoção do legado é uma feature própria, com critérios de"
            echo "validação em _reversa_sdd/sdd/descomissionamento-do-legado.md."
            exit 1
          fi
          echo "Legado intocado."

  e2e:
    name: Fluxo offline de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verificar

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 22 é piso, não preferência: `@supabase/supabase-js` declara
      # `engines: node >=22.0.0`, e no Node 20 faltam os globais `navigator`
      # (chegou no 21) e `WebSocket` (ligado por padrão no 22.4) — a suíte de
      # infrastructure quebrava só aqui, porque quem desenvolve já está no 22+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Iniciar Supabase local
        run: >-
          pnpm exec supabase start --workdir infra
          --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          --yes

      - name: Exportar credenciais locais
        run: >-
          pnpm exec supabase status --workdir infra -o env
          --override-name api.url=NEXT_PUBLIC_SUPABASE_URL
          --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY
          --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          >> $GITHUB_ENV

      - name: Instalar o navegador
        run: pnpm --filter @jiupresence/web exec playwright install chromium --with-deps

      # O cenário crítico do produto: chamada em modo avião, recarga,
      # fila preservada. Nenhum teste em jsdom prova isso.
      - name: Playwright
        run: pnpm --filter @jiupresence/web run e2e

      - name: Encerrar Supabase local
        if: always()
        run: pnpm exec supabase stop --workdir infra --no-backup

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
