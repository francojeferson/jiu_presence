name: Daily Explosm Comic Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-explosm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Remove previous cartoon image
        run: |
          rm -f latest_explosm_cartoon.png latest_explosm_cartoon.jpg latest_explosm_cartoon.jpeg latest_explosm_cartoon.webp latest_explosm_cartoon.gif

      - name: Run Explosm scraper
        run: python scripts/scrape_explosm.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "feat(comics): update Explosm cartoon [$(date +%Y-%m-%d)]"
          body: "Automated PR to update the latest Explosm cartoon"
          branch: daily-explosm-comic-updates
          base: main
          labels: automated
          commit-message: "feat(comics): update Explosm cartoon [$(date +%Y-%m-%d)]"
